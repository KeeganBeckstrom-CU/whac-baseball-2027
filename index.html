<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>WHAC Baseball 2027</title>
<link rel="icon" href="assets/whac-logo.png">
<style>
:root{--cds-font-size-body:15px;--cds-font-size-caption:13px;--cds-font-size-heading:18px;--cds-font-size-title:24px;
 --cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:12px;--cds-gap-lg:16px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:12px;--cds-pad-lg:16px;
 --cds-chart-axis:#6B7488;--cds-chart-grid:#E3E7F0;--cds-chart-muted:#A9B2C7;--cds-chart-reference:#E7131A;--cds-surface-popover:#0B1430;
 --font-anthropic-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{margin:0;background:#0A1230;color:#EEF2FA;font-family:var(--font-anthropic-sans);-webkit-text-size-adjust:100%}
#dash-root{max-width:1280px;margin:0 auto}
#st-loading{padding:40px 16px;text-align:center;color:#C9D4EE;font-family:Georgia,serif}
</style>
</head>
<body>
<div id="dash-root"><div id="st-loading">Loading WHAC Baseball 2027…</div></div>
<script src="assets/d3.min.js"></script>
<script src="assets/runtime.js"></script>
<script>
(async function () {
  // A player link looks like #c-players/Seman%2C%20Brendan. Keep the player for later and
  // give the page only the part it knows.
  const h = location.hash.slice(1);
  const i = h.indexOf('/');
  if (i > 0) { window.__startPlayer = decodeURIComponent(h.slice(i + 1)); history.replaceState(null, '', '#' + h.slice(0, i)); }
  const [known, page] = await Promise.all([
    fetch('data/_datasets.json').then((r) => r.json()),
    fetch('page.html').then((r) => r.text()),
  ]);
  dash._setKnown(known);
  const tpl = document.createElement('template');
  tpl.innerHTML = page;
  const scripts = [...tpl.content.querySelectorAll('script')];
  scripts.forEach((s) => s.remove());
  const root = document.getElementById('dash-root');
  root.replaceChildren(tpl.content);
  for (const s of scripts) {
    const el = document.createElement('script');
    el.textContent = s.textContent;
    document.body.appendChild(el);
  }
  const site = document.createElement('script');
  site.src = 'assets/site.js';
  document.body.appendChild(site);
})();
</script>
</body>
</html>

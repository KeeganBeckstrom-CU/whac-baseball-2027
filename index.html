html,body{margin:0;background:#0A1230;color:#EEF2FA;font-family:var(--font-anthropic-sans);-webkit-text-size-adjust:100%}
#dash-root{max-width:1280px;margin:0 auto}
#st-loading{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#C9D4EE;font-family:Georgia,serif}
#st-loading img{width:112px;height:112px;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.45);animation:st-pulse 1.4s ease-in-out infinite}

<body>
<div id="dash-root"><div id="st-loading"><img src="assets/icons/icon-192.png" alt="">Loading WHAC Baseball 2027…</div></div>
<script src="assets/d3.min.js"></script>
<script src="assets/runtime.js"></script>
<script>
(async function () {
  // A player link looks like #c-players/Seman%2C%20Brendan. Keep the player for later and
  // give the page only the part it knows.
  const h = location.hash.slice(1);
  const i = h.indexOf('/');
  if (i > 0) { window.__startPlayer = decodeURIComponent(h.slice(i + 1)); history.replaceState(null, '', '#' + h.slice(0, i)); }
  const [known, page] = await Promise.all([
    fetch('data/_datasets.json').then((r) => r.json()),
    fetch('page.html').then((r) => r.text()),
  ]);
  dash._setKnown(known);
  const tpl = document.createElement('template');
  tpl.innerHTML = page;
  const scripts = [...tpl.content.querySelectorAll('script')];
  scripts.forEach((s) => s.remove());
  const root = document.getElementById('dash-root');
  root.replaceChildren(tpl.content);
  for (const s of scripts) {
    const el = document.createElement('script');
    el.textContent = s.textContent;
    document.body.appendChild(el);
  }
  const site = document.createElement('script');
  site.src = 'assets/site.js';
  document.body.appendChild(site);
})();
</script>
</body>
